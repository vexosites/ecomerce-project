services:
  api:
    build: .
    working_dir: /app
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:reacender@db:5432/ecomerce_project
      REDIS_URL: redis://redis:6379
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - db
      - redis

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ecomerce_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: reacender
    ports:
      - "5432:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  postgresdata:
  redisdata: